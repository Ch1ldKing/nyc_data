[project]
name = "urban-flooding"
version = "0.1.0"
description = "Reproducible NYC street-flooding report analysis starter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "omegaconf>=2.3",
  "requests>=2.31",
  "folium>=0.17",
  "pysheds>=0.5",
]
[project.optional-dependencies]
full = ["pyarrow", "duckdb", "polars", "rioxarray", "libpysal", "esda", "splot", "spreg", "mapclassify", "xgboost", "lightgbm", "shap", "plotly", "kaleido", "contextily", "scienceplots", "jupyterlab", "openpyxl"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/urban_flooding"]
[tool.pytest.ini_options]
pythonpath = ["src"]
